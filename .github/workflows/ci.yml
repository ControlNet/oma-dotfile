name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Upstream skills, the skills CLI and npm change without a commit here.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Python tests
        run: python -m unittest discover -s tests
      - name: Node tests
        run: node --test "tests/*.test.mjs"

  install:
    # A real install on the runner itself: its home and global git config are thrown away.
    name: install (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install, reinstall and switch modes
        run: python tests/integration/check_install.py
      - name: The README's PowerShell one-liner
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CODEX_BASE_URL: https://gateway.invalid/v1
          CODEX_API_TOKEN: ci-test-value-not-a-token
        run: |
          (Get-Content -Raw pull.py) | python - --repo . --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
