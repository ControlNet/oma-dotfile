# Native OpenAI Codex OAuth model limits.
# OMP has no separate input limit, so the total context window is set to 272K.
providers:
  openai-codex:
    modelOverrides:
      gpt-6-luna:
        contextWindow: 272000
        maxTokens: 128000
      gpt-6-luna-fast:
        contextWindow: 272000
        maxTokens: 128000
      gpt-6-sol:
        contextWindow: 272000
        maxTokens: 128000
      gpt-6-sol-fast:
        contextWindow: 272000
        maxTokens: 128000
